name: Master dashboard (scan + backtest)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/master-dashboard.yml'

permissions:
  contents: read

jobs:
  master-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run master dashboard
        run: python run_master.py

      - name: Upload dashboard and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overreaction-master-dashboard
          path: |
            reports/
            output/
          if-no-files-found: warn
