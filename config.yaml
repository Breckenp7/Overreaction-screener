# ============================================================
#  Market Overreaction Screener - settings
#  Edit the numbers below, save, and the next scan uses them.
#  (On GitHub you can edit this file right in your browser.)
# ============================================================

universe:
  min_market_cap_billions: 10        # only companies at/above this size
  sources: [sp500, sp400, nasdaq100] # free index lists used as the starting universe
  extra_tickers_file: extra_tickers.txt  # add any other tickers (e.g. SOFI) there

detection:
  daily_drop_pct: 7.0          # flag a one-day fall of at least this much
  multi_day_window: 5          # ...or a fall over this many trading days
  multi_day_drop_pct: 12.0     # retained for legacy reference; not used to qualify
  include_earnings_misses: true   # false = hide drops where EPS clearly missed estimates
  include_uncategorized: true     # false = only show drops that fit one of the 3 categories

categories:
  broad_market:
    spy_drop_pct: 2.0          # market counts as "selling off" if S&P 500 ETF falls this much
    sector_drop_pct: 3.0       # ...or the stock's sector ETF falls this much
    min_stock_drop_pct: 5.0    # stock must still have fallen at least this much
  technical_support:
    tolerance_pct: 1.5         # prices within this % are treated as the same "level"
    min_touches: 3             # level must have been tested/bounced at least this many times
    min_bounce_pct: 4.0        # a "bounce" = rose at least this much within 10 days
    near_level_pct: 3.0        # current price must be within this % of the level

history:
  similar_drop_ratio: 0.75     # "similar" past drop = at least 75% as big as today's
  min_similar_drop_pct: 4.0    # ...but never smaller than this
  cooldown_days: 0            # ignore repeat drops within this many days of each other
  horizons: [1, 2, 3, 5, 10, 20]        # forward trading days to measure
  round_trip_cost_bps: 10      # assumed trading cost (10 bps = 0.10%) subtracted from returns
  years: 10                    # how much history to pull per candidate

scoring:
  # Weights must add up to 100. Missing data -> that component is skipped and the
  # rest are re-scaled (the report says how much of the rubric was usable).
  weights:
    drop_severity: 0
    market_context: 15
    earnings_quality: 20
    fundamentals: 15
    historical_rebound: 30
    valuation: 5
    technical_support: 15
  category_multiplier:         # mild preference for earnings setups, as in your brief
    earnings_overreaction: 1.0
    technical_support: 0.9
    broad_market: 0.9
    other: 0.8
  max_news_penalty: 10
  eps_miss_penalty: 15

report:
  top_n: 10                    # candidates in the full report
  alert_top_n: 3               # candidates in the phone push notification
  min_alert_score: 55          # push only if the best score is at least this
  news_items: 3

schedule:
  # What each scan sends. The scan times themselves live in
  # .github/workflows/scan.yml (see README).
  send_email_when_empty: {open: false, close: true}   # "nothing found" note after close only
  send_push_when_empty: false

# Rough analytics only: a stock's own history has few events, so the report
# also shows pooled statistics from data/pool_stats.json (built weekly).
pooled_stats_file: data/pool_stats.json
state_file: data/state.json
